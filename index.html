<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Words Galore</title>
  <style>
    :root {
      --ink: #25324a;
      --pink: #ff5fa2;
      --gold: #ffbf3f;
      --green: #22c878;
      --card: rgba(255,255,255,0.98);
      --shadow: 0 8px 24px rgba(37,50,74,0.12);
    }

    * { box-sizing: border-box; touch-action: none; }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      height: 100vh;
      background: linear-gradient(135deg, #fffbe2, #ffe8f6, #e7f8ff);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .wrap {
      width: 95vw;
      max-width: 800px;
      height: 90vh;
      background: var(--card);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 15px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Start Screen Overlay to fix the auto-start issue */
    .start-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .start-overlay h2 {
      font-size: 2rem;
      color: var(--ink);
      margin-bottom: 20px;
    }

    .hero { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    h1 { margin: 0; font-size: 1.4rem; color: var(--ink); }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .stat {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 8px;
      text-align: center;
      border: 1px solid #eee;
    }

    .stat-label { font-size: 0.6rem; color: #6d7689; display: block; text-transform: uppercase; font-weight: bold; }
    .stat-value { font-size: 1.1rem; font-weight: 800; }

    .current-box {
      margin-bottom: 10px;
      background: #eee;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-weight: 800;
      min-height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      letter-spacing: 2px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 15px;
      flex: 1;
      min-height: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      user-select: none;
    }

    .tile {
      aspect-ratio: 1/1;
      border-radius: 8px;
      background: #fff;
      font-size: 1.4rem;
      font-weight: 800;
      box-shadow: 0 3px 6px rgba(0,0,0,0.05);
      border: 2px solid #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .tile.selected { 
      background: var(--gold); 
      color: #fff; 
      border-color: #f3a61c;
      transform: scale(0.95);
    }

    /* Leaderboard Container Optimized for 10 items with clean scrolling */
    .word-list-container {
      display: flex;
      flex-direction: column;
      border-left: 1px solid #eee;
      padding-left: 15px;
      min-height: 0; 
    }

    .word-list {
      list-style: none;
      padding: 0;
      margin: 0;
      overflow-y: auto; /* Allows inside scrolling seamlessly */
      flex: 1;
    }

    .word-list li { 
      padding: 6px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
    }

    .rank-num { color: var(--pink); font-weight: 800; margin-right: 5px; }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 24px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      background: var(--pink);
      font-size: 1rem;
    }

    .btn-reset {
      padding: 8px 16px;
      font-size: 0.85rem;
    }

    #message { height: 20px; text-align: center; font-weight: bold; margin-top: 10px; }

    @media (max-width: 600px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 1fr 150px; }
      .word-list-container { border-left: none; padding-left: 0; border-top: 1px solid #eee; padding-top: 10px; }
    }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="start-overlay" id="startOverlay">
      <h2>Ready to Play?</h2>
      <button class="btn" onclick="pressPlay()">Start Game</button>
    </div>

    <div class="hero">
      <h1>Words Galore</h1>
      <button class="btn btn-reset" onclick="startNewGame()">Reset Board</button>
    </div>

    <div class="stats">
      <div class="stat"><span class="stat-label">Time</span><span id="timeDisplay" class="stat-value">1:30</span></div>
      <div class="stat"><span class="stat-label">Words</span><span id="wordsDisplay" class="stat-value">0</span></div>
      <div class="stat"><span class="stat-label">Score</span><span id="scoreDisplay" class="stat-value">0</span></div>
      <div class="stat"><span class="stat-label">Best All-Time</span><span id="bestDisplay" class="stat-value">0</span></div>
    </div>

    <div class="current-box" id="currentWord">DRAG TO CONNECT</div>

    <div class="layout">
      <div class="grid" id="grid"></div>
      <div class="word-list-container">
        <h3 style="margin: 0 0 10px 0; font-size: 0.8rem; color: #6d7689; text-transform: uppercase;">Top 10 High Scores</h3>
        <ul class="word-list" id="leaderboard"></ul>
      </div>
    </div>
    <div id="message"></div>
  </div>

  <script>
    const BOARD_SIZE = 6;
    let DICTIONARY = new Set();
    const LETTER_POOL = 'AAAAAAAAAEEEEEEEEEEEEIIIIIIIIIOOOOOOOOUUUUDDDDGGGGBCMPFHVWYKJXQZ'.split('');

    let board = [];
    let selectedPath = [];
    let foundWords = new Set();
    let score = 0, timeLeft = 90;
    let timerId = null, gameActive = false, isDragging = false;

    // Direct translation of your dictionary list
    const words = ["able","about","above","accept","across","act","action","add","after","again","age","ago","agree","air","all","allow","almost","along","also","always","am","among","amount","and","animal","another","answer","any","appear","are","area","around","arrive","art","as","ask","at","away","baby","back","bad","bag","ball","bank","base","be","bear","beat","beauty","because","become","bed","been","before","begin","behind","believe","best","better","between","big","bird","bit","black","blue","boat","body","book","both","box","boy","bring","build","busy","but","buy","by","call","came","can","car","care","carry","case","cat","cause","center","change","check","child","city","class","clean","clear","close","cold","come","common","complete","contain","continue","cool","copy","corn","cost","could","country","course","cover","create","cut","dark","data","day","dead","deal","decide","deep","develop","did","different","do","dog","done","door","down","draw","dream","drive","dry","during","each","early","earth","easy","eat","edge","end","enough","even","ever","every","example","eye","face","fact","fall","family","far","farm","fast","father","feel","feet","few","field","figure","fill","final","find","fine","fire","first","fish","fit","five","floor","follow","food","for","force","form","found","four","free","friend","from","front","full","fun","game","gave","get","girl","give","go","gold","good","got","great","green","ground","group","grow","had","half","hand","happen","hard","has","have","he","head","hear","heat","help","her","here","high","him","his","home","horse","hot","hour","house","how","however","idea","if","important","in","interest","into","is","it","job","join","just","keep","kind","king","knew","know","land","large","last","late","later","laugh","lead","learn","leave","left","less","let","letter","life","light","like","line","list","listen","little","live","long","look","lot","love","low","made","make","man","many","may","me","mean","measure","men","might","mile","mind","miss","more","most","mother","move","much","must","my","name","near","need","never","new","next","night","no","not","note","nothing","now","number","of","off","often","old","on","once","one","only","open","or","order","other","our","out","over","own","page","paper","part","pass","past","pay","people","perhaps","person","place","plan","play","point","power","press","problem","program","provide","put","question","quick","quite","rain","ran","reach","read","ready","real","reason","receive","record","red","remember","rest","result","right","river","road","rock","room","run","said","same","saw","say","school","sea","second","see","seem","self","send","set","several","she","should","show","side","simple","since","small","so","some","something","soon","sound","south","space","stand","start","state","stay","step","still","stop","story","street","strong","study","such","sun","system","take","talk","tell","ten","term","than","that","the","their","them","then","there","these","they","thing","think","this","those","thought","three","through","time","to","together","told","too","took","top","toward","town","tree","try","turn","two","under","until","up","upon","us","use","usually","very","want","war","was","watch","water","way","we","week","well","went","were","what","when","where","which","while","white","who","why","will","with","word","work","world","would","write","year","yes","yet","you","young","zip","zoo","zoom","zig","zag"];
    DICTIONARY = new Set(words.map(w => w.toLowerCase()));

    // Load High Scores from LocalStorage (Up to 10 entries)
    let localLeaderboard = JSON.parse(localStorage.getItem('wordsGaloreLeaderboard')) || [];
    let bestScore = localStorage.getItem('wordsGaloreBest') || 0;
    document.getElementById('bestDisplay').textContent = bestScore;

    function buildBoard() {
      board = Array.from({ length: BOARD_SIZE }, () =>
        Array.from({ length: LETTER_POOL.length }, () => LETTER_POOL[Math.floor(Math.random() * LETTER_POOL.length)])
      );
    }

    function renderBoard() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      board.forEach((row, r) => {
        row.forEach((letter, c) => {
          if(r < BOARD_SIZE && c < BOARD_SIZE) {
            const tile = document.createElement('div');
            tile.className = 'tile' + (selectedPath.some(p => p.r === r && p.c === c) ? ' selected' : '');
            tile.textContent = letter;
            tile.setAttribute('data-r', r);
            tile.setAttribute('data-c', c);
            grid.appendChild(tile);
          }
        });
      });
      const current = selectedPath.map(p => board[p.r][p.c]).join('');
      document.getElementById('currentWord').textContent = current || 'DRAG TO CONNECT';
    }

    function handleInput(e) {
      if (!gameActive || !isDragging) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const target = document.elementFromPoint(clientX, clientY);
      
      if (target && target.hasAttribute('data-r')) {
        const r = parseInt(target.getAttribute('data-r'));
        const c = parseInt(target.getAttribute('data-c'));
        
        const alreadyInPath = selectedPath.find(p => p.r === r && p.c === c);
        if (!alreadyInPath) {
          const last = selectedPath[selectedPath.length - 1];
          if (!last || (Math.abs(last.r - r) <= 1 && Math.abs(last.c - c) <= 1)) {
            selectedPath.push({r, c});
            renderBoard();
          }
        }
      }
    }

    function endSelection() {
      if (!isDragging) return;
      isDragging = false;
      const word = selectedPath.map(p => board[p.r][p.c]).join('').toLowerCase();
      const msg = document.getElementById('message');

      if (word.length >= 3) {
        if (DICTIONARY.has(word) && !foundWords.has(word)) {
          foundWords.add(word);
          score += (word.length * 20); // Length bonus scoring
          document.getElementById('wordsDisplay').textContent = foundWords.size;
          document.getElementById('scoreDisplay').textContent = score;
          msg.textContent = `✔ ${word.toUpperCase()}`; msg.style.color = "var(--green)";
        } else {
          msg.textContent = foundWords.has(word) ? "ALREADY FOUND" : "NOT IN LIST";
          msg.style.color = "var(--pink)";
        }
      }
      selectedPath = [];
      renderBoard();
      setTimeout(() => msg.textContent = "", 1000);
    }

    function pressPlay() {
      document.getElementById('startOverlay').style.display = 'none';
      startNewGame();
    }

    function startNewGame() {
      foundWords.clear(); score = 0; timeLeft = 90;
      document.getElementById('wordsDisplay').textContent = '0';
      document.getElementById('scoreDisplay').textContent = '0';
      gameActive = true; buildBoard(); renderBoard(); updateLeaderboardDisplay();
      
      if (timerId) clearInterval(timerId);
      timerId = setInterval(() => {
        timeLeft--;
        const m = Math.floor(timeLeft/60), s = timeLeft%60;
        document.getElementById('timeDisplay').textContent = `${m}:${s.toString().padStart(2,'0')}`;
        if (timeLeft <= 0) {
          clearInterval(timerId); gameActive = false;
          handleGameOver();
        }
      }, 1000);
    }

    function handleGameOver() {
      // Check All-Time Personal Best
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('wordsGaloreBest', bestScore);
        document.getElementById('bestDisplay').textContent = bestScore;
      }

      // Check Leaderboard Inclusion (Top 10)
      const lowestScore = localLeaderboard.length < 10 ? 0 : localLeaderboard[9].score;
      if (score > lowestScore || localLeaderboard.length < 10) {
        setTimeout(() => {
          const name = prompt(`Great game! You scored ${score} points. Enter your initials for the leaderboard:`) || "ANON";
          localLeaderboard.push({ name: name.substring(0, 5).toUpperCase(), score: score });
          // Sort descending
          localLeaderboard.sort((a, b) => b.score - a.score);
          // Keep only top 10 positions
          localLeaderboard = localLeaderboard.slice(0, 10);
          localStorage.setItem('wordsGaloreLeaderboard', JSON.stringify(localLeaderboard));
          updateLeaderboardDisplay();
        }, 500);
      } else {
        alert(`Game Over! You found ${foundWords.size} words and scored ${score} points.`);
      }
      document.getElementById('startOverlay').style.display = 'flex';
    }

    function updateLeaderboardDisplay() {
      const boardEl = document.getElementById('leaderboard');
      boardEl.innerHTML = '';
      
      // Ensure we explicitly display 10 positions
      for (let i = 0; i < 10; i++) {
        const item = localLeaderboard[i];
        const li = document.createElement('li');
        if (item) {
          li.innerHTML = `<span><span class="rank-num">#${i+1}</span> ${item.name}</span> <span>${item.score}</span>`;
        } else {
          // Placeholder empty spots until people populate them
          li.innerHTML = `<span><span class="rank-num">#${i+1}</span> Open Spot</span> <span>--</span>`;
        }
        boardEl.appendChild(li);
      }
    }

    // Input event binding
    const gridEl = document.getElementById('grid');
    gridEl.addEventListener('mousedown', (e) => { if(gameActive) { isDragging = true; handleInput(e); } });
    gridEl.addEventListener('touchstart', (e) => { if(gameActive) { isDragging = true; handleInput(e); } }, {passive: false});
    window.addEventListener('mousemove', handleInput);
    window.addEventListener('touchmove', handleInput, {passive: false});
    window.addEventListener('mouseup', endSelection);
    window.addEventListener('touchend', endSelection);

    // Load visual layout immediately upon landing
    buildBoard();
    renderBoard();
    updateLeaderboardDisplay();
  </script>
</body>
</html>
