<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Words Galore</title>
  <style>
    :root {
      --ink: #25324a;
      --pink: #ff5fa2;
      --gold: #ffbf3f;
      --green: #22c878;
      --blue: #6e7ff2;
      --purple: #9b59b6;
    }
    * { box-sizing: border-box; touch-action: none; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #fffbe2, #ffe8f6, #e7f8ff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      overflow-y: auto;
    }
    .wrap {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 10px 0;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      background: white;
      padding: 14px 20px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      font-weight: bold;
      font-size: 1.15rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      background: white;
      padding: 12px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    }
    .tile {
      aspect-ratio: 1/1;
      background: #ffffff;
      border: 3px solid #e2e8f0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--ink);
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      transition: all 0.15s ease;
      user-select: none;
    }
    .tile.active {
      background: var(--gold);
      color: white;
      border-color: #f3a61c;
      transform: scale(0.9);
    }
    .current-word-display {
      background: white;
      padding: 14px;
      text-align: center;
      border-radius: 20px;
      font-size: 1.3rem;
      font-weight: 900;
      min-height: 52px;
      letter-spacing: 2px;
      color: var(--blue);
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      text-transform: uppercase;
    }
    .controls {
      display: flex;
      gap: 12px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 20px;
      color: white;
      font-weight: bold;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: all 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-shuffle { background: var(--purple); }
    .btn-new { background: var(--pink); }
    
    #msg {  
      text-align: center; 
      font-weight: bold; 
      font-size: 1.1rem;
      min-height: 26px;
    }
    
    .leaderboard-box {
      background: white;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    }
    .leaderboard-title {
      margin: 0 0 10px 0;
      font-size: 1.1rem;
      color: var(--ink);
      font-weight: bold;
      text-align: center;
      border-bottom: 2px solid #f3f4f4;
      padding-bottom: 6px;
    }
    .leaderboard-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 8px;
      font-size: 0.95rem;
      border-radius: 8px;
    }
    .leaderboard-row:nth-child(even) { background: #fafafa; }
    .leaderboard-row.highlight { background: #fff4d4; font-weight: bold; }

    /* Custom Popup Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(37, 50, 74, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 24px;
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-content h3 { margin: 0 0 10px; color: var(--ink); font-size: 1.4rem; }
    .modal-content p { margin: 0 0 20px; color: #555; font-size: 1rem; }
    .modal-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 1.1rem;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      margin-bottom: 16px;
      text-align: center;
      outline: none;
    }
    .modal-input:focus { border-color: var(--blue); }
    .modal-btn {
      width: 100%;
      padding: 14px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="stats">
    <div>Time: <span id="timer">1:30</span></div>
    <div>Score: <span id="scoreDisplay">0</span></div>
  </div>
  
  <div class="current-word-display" id="tray">DRAG TO FORM WORDS</div>
  <div class="grid" id="grid"></div>
  
  <div id="msg"></div>

  <div class="controls">
    <button class="btn btn-shuffle" onclick="shuffleBoard()">Shuffle Board</button>
    <button class="btn btn-new" onclick="resetGame()">New Game</button>
  </div>

  <div class="leaderboard-box">
    <div class="leaderboard-title">🏆 Today's Top Scores</div>
    <div id="leaderboardContent"></div>
  </div>
</div>

<div class="modal-overlay" id="scoreModal">
  <div class="modal-content">
    <h3 id="modalTitle">🎉 New High Score!</h3>
    <p id="modalScoreText">You earned 0 points.</p>
    <input type="text" id="playerNameInput" class="modal-input" placeholder="Your Name" maxlength="12" style="touch-action: auto;">
    <button class="modal-btn" onclick="submitName()">Save Score</button>
  </div>
</div>

<script>
const TILES = "AAAAAAAAABBCCDDDDEEEEEEEEEEEEFFGGGHHIIIIIIJKLLLLMMNNNNNNOOOPPPQRRRRRRSSSSTTTTTTUUUVVWWXXYYYZ".split('');
const API_URL = "https://words-galore-api.lisa-668.workers.dev"; [cite: 1]

let DICT = new Set();
let activePath = [];
let foundWords = new Set();
let isDragging = false;
let gameActive = false;
let timeLeft = 90;
let timerInterval = null;
let boardLetters = [];
let currentScore = 0;

async function loadDictionary() {
  try {
    const res = await fetch('https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt'); [cite: 1]
    if (!res.ok) throw new Error(`HTTP ${res.status}`); [cite: 1]
    
    const text = await res.text(); [cite: 1]
    DICT = new Set(
      text.split('\n') [cite: 1]
          .map(w => w.trim().toLowerCase()) [cite: 1]
          .filter(w => w.length >= 3 && /^[a-z]+$/.test(w)) [cite: 1]
    );
    loadLeaderboard();
    resetGame();
  } catch (e) {
    console.error(e);
    document.getElementById('msg').textContent = "Failed loading words."; [cite: 1]
  }
}

function createBoard() {
  const grid = document.getElementById('grid'); [cite: 1]
  grid.innerHTML = ''; [cite: 1]
  boardLetters = []; [cite: 1]
  
  for (let i = 0; i < 36; i++) {
    const letter = TILES[Math.floor(Math.random() * TILES.length)]; [cite: 1]
    boardLetters.push(letter); [cite: 1]
    
    const div = document.createElement('div'); [cite: 1]
    div.className = 'tile'; [cite: 1]
    div.textContent = letter; [cite: 1]
    div.dataset.index = i; [cite: 1]
    grid.appendChild(div); [cite: 1]
  }
}

function shuffleBoard() {
  if (!gameActive) return; [cite: 1]
  const tiles = document.querySelectorAll('.tile'); [cite: 1]
  tiles.forEach(t => t.style.transform = 'scale(0.85)'); [cite: 1]
  
  setTimeout(() => {
    createBoard();
    activePath = []; [cite: 1]
    document.getElementById('tray').textContent = "DRAG TO FORM WORDS"; [cite: 1]
  }, 200);
}

function handleInteraction(e) {
  if (!gameActive || !isDragging) return; [cite: 1]
  
  const x = e.touches ? e.touches[0].clientX : e.clientX; [cite: 1]
  const y = e.touches ? e.touches[0].clientY : e.clientY; [cite: 1]
  const target = document.elementFromPoint(x, y); [cite: 1]
  
  if (target && target.classList.contains('tile')) {
    const idx = parseInt(target.dataset.index); [cite: 1]
    if (!activePath.includes(idx)) { [cite: 1]
      if (activePath.length > 0) { [cite: 1]
        const last = activePath[activePath.length-1]; [cite: 1]
        const rowDiff = Math.abs(Math.floor(last/6) - Math.floor(idx/6)); [cite: 1]
        const colDiff = Math.abs((last%6) - (idx%6)); [cite: 1]
        if (rowDiff > 1 || colDiff > 1) return; [cite: 1]
      }
      activePath.push(idx); [cite: 1]
      target.classList.add('active'); [cite: 1]
      updateTray();
    }
  }
}

function updateTray() {
  const word = activePath.map(idx => boardLetters[idx]).join(''); [cite: 1]
  document.getElementById('tray').textContent = word; [cite: 1]
}

function calculatePoints(wordLength) {
  if (wordLength === 3) return 100; [cite: 1]
  if (wordLength === 4) return 200; [cite: 1]
  if (wordLength === 5) return 400; [cite: 1]
  return 800; [cite: 1]
}

function submitWord() {
  const word = document.getElementById('tray').textContent.toLowerCase().trim(); [cite: 1]
  const msg = document.getElementById('msg'); [cite: 1]
  
  if (word.length < 3) { [cite: 1]
    cleanup();
    return;
  }

  if (DICT.has(word) && !foundWords.has(word)) { [cite: 1]
    foundWords.add(word); [cite: 1]
    
    const pointsEarned = calculatePoints(word.length); [cite: 1]
    currentScore += pointsEarned; [cite: 1]
    document.getElementById('scoreDisplay').textContent = currentScore; [cite: 1]
    
    if(word.length >= 5) { [cite: 1]
      timeLeft += 5; [cite: 1]
      msg.textContent = `💥 AMAZING! +${pointsEarned} pts (+5s Bonus!)`; [cite: 1]
      msg.style.color = "var(--purple)"; [cite: 1]
    } else {
      msg.textContent = `✨ NICE! +${pointsEarned} pts`; [cite: 1]
      msg.style.color = "var(--green)"; [cite: 1]
    }

    activePath.forEach(idx => { [cite: 1]
      const newLetter = TILES[Math.floor(Math.random() * TILES.length)]; [cite: 1]
      boardLetters[idx] = newLetter; [cite: 1]
      const tile = document.querySelector(`[data-index="${idx}"]`); [cite: 1]
      if (tile) tile.textContent = newLetter; [cite: 1]
    });

  } else {
    msg.textContent = foundWords.has(word) ? "ALREADY FOUND" : "NOT A WORD"; [cite: 1]
    msg.style.color = "var(--pink)"; [cite: 1]
  }
  cleanup();
}

function cleanup() {
  document.querySelectorAll('.tile').forEach(t => t.classList.remove('active')); [cite: 1]
  activePath = []; [cite: 1]
  document.getElementById('tray').textContent = "DRAG TO FORM WORDS"; [cite: 1]
}

window.addEventListener('mousedown', () => isDragging = true); [cite: 1]
window.addEventListener('touchstart', () => isDragging = true); [cite: 1]
window.addEventListener('mousemove', handleInteraction); [cite: 1]
window.addEventListener('touchmove', handleInteraction); [cite: 1]
window.addEventListener('mouseup', () => { if(isDragging){ isDragging=false; submitWord(); }}); [cite: 1]
window.addEventListener('touchend', () => { if(isDragging){ isDragging=false; submitWord(); }}); [cite: 1]

function resetGame() {
  if(timerInterval) clearInterval(timerInterval); [cite: 1]
  foundWords.clear(); [cite: 1]
  currentScore = 0; [cite: 1]
  document.getElementById('scoreDisplay').textContent = '0'; [cite: 1]
  document.getElementById('msg').textContent = ''; [cite: 1]
  timeLeft = 90; [cite: 1]
  gameActive = true; [cite: 1]
  createBoard();
  startTimer();
}

function startTimer() {
  const timerDisplay = document.getElementById('timer'); [cite: 1]
  timerInterval = setInterval(() => {
    timeLeft--; [cite: 1]
    let m = Math.floor(timeLeft / 60); [cite: 1]
    let s = timeLeft % 60; [cite: 1]
    timerDisplay.textContent = `${m}:${s < 10 ? '0' : ''}${s}`; [cite: 1]
    
    if (timeLeft <= 0) { [cite: 1]
      clearInterval(timerInterval); [cite: 1]
      gameActive = false; [cite: 1]
      checkLeaderboardEligibility(currentScore);
    }
  }, 1000);
}

// FIXED: Changed .slice(0, 5) to .slice(0, 10) so all 10 rows safely print to the screen
function renderLeaderboard(scores, highlightIndex = -1) {
  const container = document.getElementById('leaderboardContent'); [cite: 1]
  container.innerHTML = ""; [cite: 1]
  scores.sort((a,b) => b.score - a.score).slice(0, 10).forEach((entry, idx) => { [cite: 1]
    const row = document.createElement('div'); [cite: 1]
    row.className = `leaderboard-row ${idx === highlightIndex ? 'highlight' : ''}`; [cite: 1]
    row.innerHTML = `<span>${idx + 1}. ${entry.name}</span><span>${entry.score} pts</span>`; [cite: 1]
    container.appendChild(row); [cite: 1]
  });
}

async function loadLeaderboard() {
  try {
    const res = await fetch(API_URL); [cite: 1]
    const scores = await res.json(); [cite: 1]
    
    if (scores.length === 0) { [cite: 1]
      renderLeaderboard([
        { name: "WordMaster99", score: 2500 }, [cite: 1]
        { name: "TileFinder", score: 1800 }, [cite: 1]
        { name: "LexisRex", score: 1200 }, [cite: 1]
        { name: "BoggleBot", score: 800 }, [cite: 1]
        { name: "AlphaGamer", score: 400 } [cite: 1]
      ]);
    } else {
      renderLeaderboard(scores);
    }
  } catch (e) {
    console.error("Could not fetch global leaderboard:", e); [cite: 1]
  }
}

async function checkLeaderboardEligibility(finalScore) {
  document.getElementById('modalScoreText').textContent = `You scored ${finalScore} points!`; [cite: 1]
  const nameInput = document.getElementById('playerNameInput'); [cite: 1]
  
  try {
    const res = await fetch(API_URL); [cite: 1]
    const scores = await res.json(); [cite: 1]
    
    // Checks eligibility against the 10th spot instead of the 5th
    const isTopScore = scores.length < 10 || finalScore > (scores[9]?.score || 0); [cite: 1]
    
    if (isTopScore) {
      document.getElementById('modalTitle').textContent = "🎉 New Global Top 10!"; [cite: 1]
      nameInput.style.display = "block"; [cite: 1]
      nameInput.value = ""; [cite: 1]
    } else {
      document.getElementById('modalTitle').textContent = "⏰ Time's Up!"; [cite: 1]
      nameInput.style.display = "none"; [cite: 1]
    }
  } catch(e) {
    document.getElementById('modalTitle').textContent = "⏰ Time's Up!"; [cite: 1]
    nameInput.style.display = "none"; [cite: 1]
  }
  
  document.getElementById('scoreModal').style.display = "flex"; [cite: 1]
}

async function submitName() {
  const finalScore = currentScore; [cite: 1]
  const nameInput = document.getElementById('playerNameInput'); [cite: 1]
  
  if (nameInput.style.display !== "none") { [cite: 1]
    const rawName = nameInput.value.trim(); [cite: 1]
    const name = rawName !== "" ? rawName : "Player One"; [cite: 1]
    
    try {
      const res = await fetch(API_URL, { [cite: 1]
        method: "POST", [cite: 1]
        headers: { "Content-Type": "application/json" }, [cite: 1]
        body: JSON.stringify({ name: name, score: finalScore }) [cite: 1]
      });
      const updatedScores = await res.json(); [cite: 1]
      
      const highlightIdx = updatedScores.findIndex(e => e.score === finalScore && e.name === name.substring(0, 12)); [cite: 1]
      renderLeaderboard(updatedScores, highlightIdx);
    } catch(e) {
      console.error("Failed saving score online:", e); [cite: 1]
    }
  }
  
  document.getElementById('scoreModal').style.display = "none"; [cite: 1]
}

loadDictionary();
</script>
</body>
</html>
