<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Words Galore</title>
  <style>
    :root {
      --ink: #25324a;
      --pink: #ff5fa2;
      --gold: #ffbf3f;
      --green: #22c878;
      --card: rgba(255,255,255,0.96);
      --shadow: 0 8px 24px rgba(37,50,74,0.12);
    }

    * { box-sizing: border-box; touch-action: none; } 

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      height: 100vh;
      background: linear-gradient(135deg, #fffbe2, #ffe8f6, #e7f8ff);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Restored to your full-size layout */
    .wrap {
      width: 95vw;
      max-width: 800px;
      height: 95vh;
      background: var(--card);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    .hero { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    h1 { margin: 0; font-size: 1.6rem; color: var(--pink); }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .stat {
      background: #fff;
      border-radius: 12px;
      padding: 8px;
      text-align: center;
      border: 1px solid #f0f0f0;
    }

    .stat-label { font-size: 0.65rem; color: #6d7689; display: block; text-transform: uppercase; font-weight: bold; }
    .stat-value { font-size: 1.2rem; font-weight: 800; }

    /* The original layout split side-by-side */
    .layout {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 15px;
      flex: 1;
      min-height: 0;
    }

    .game-area {
      display: flex;
      flex-direction: column;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      user-select: none;
      flex: 1;
    }

    /* Restored to large, bold, highly visible tile format */
    .tile {
      aspect-ratio: 1/1;
      border-radius: 10px;
      background: #fff;
      font-size: 1.6rem;
      font-weight: 800;
      box-shadow: 0 4px 0px #e0e0e0;
      border: 2px solid #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .tile.active {
      background: var(--gold);
      color: #fff;
      border-color: #f3a61c;
      box-shadow: 0 2px 0px #f3a61c;
      transform: translateY(2px);
    }

    .current-word-display {
      margin-bottom: 10px;
      background: #f8f9fa;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      font-weight: 800;
      min-height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      letter-spacing: 3px;
      border: 2px dashed #dee2e6;
    }

    /* Leaderboard box customized for 10 rows with scrollbar */
    .leaderboard-container {
      display: flex;
      flex-direction: column;
      background: #fdfdfd;
      border-radius: 12px;
      padding: 10px;
      border: 1px solid #f0f0f0;
      min-height: 0;
    }

    .leaderboard-list {
      list-style: none;
      padding: 0;
      margin: 0;
      overflow-y: auto;
      flex: 1;
    }

    .leaderboard-list li {
      display: flex;
      justify-content: space-between;
      padding: 6px;
      border-bottom: 1px solid #eee;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 10px 15px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
    }
    .btn-pink { background: var(--pink); }

    #msg { font-weight: 900; height: 24px; font-size: 1rem; text-align: center; margin-top: 10px; text-transform: uppercase; }

    @media (max-width: 600px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 1fr 150px; }
      .leaderboard-container { border-top: 1px solid #eee; padding-top: 10px; }
    }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="hero">
      <h1>Words Galore</h1>
      <button class="btn btn-pink" onclick="resetGame()">Reset Board</button>
    </div>

    <div class="stats">
      <div class="stat"><span class="stat-label">Time</span><span id="timer" class="stat-value">1:30</span></div>
      <div class="stat"><span class="stat-label">Words</span><span id="wordCount" class="stat-value">0</span></div>
    </div>

    <div class="game-area">
      <div class="current-word-display" id="tray">DRAG TO CONNECT</div>
      
      <div class="layout">
        <div class="grid" id="grid"></div>
        
        <div class="leaderboard-container">
          <h3 style="margin: 0 0 10px 0; font-size: 0.8rem; color: #999; text-transform: uppercase;">Daily Leaderboard</h3>
          <ul class="leaderboard-list" id="leaderboard"></ul>
        </div>
      </div>
      
      <div id="msg"></div>
    </div>
  </div>

  <script>
    const WORDS = ["able","about","above","accept","across","act","action","add","after","again","age","ago","agree","air","all","allow","almost","along","also","always","am","among","amount","and","animal","another","answer","any","appear","are","area","around","arrive","art","as","ask","at","away","baby","back","bad","bag","ball","bank","base","be","bear","beat","beauty","because","become","bed","been","before","begin","behind","believe","best","better","between","big","bird","bit","black","blue","boat","body","book","both","box","boy","bring","build","busy","but","buy","by","call","came","can","car","care","carry","case","cat","cause","center","change","check","child","city","class","clean","clear","close","cold","come","common","complete","contain","continue","cool","copy","corn","cost","could","country","course","cover","create","cut","dark","data","day","dead","deal","decide","deep","develop","did","different","do","dog","done","door","down","draw","dream","drive","dry","during","each","early","earth","easy","eat","edge","end","enough","even","ever","every","example","eye","face","fact","fall","family","far","farm","fast","father","feel","feet","few","field","figure","fill","final","find","fine","fire","first","fish","fit","five","floor","follow","food","for","force","form","found","four","free","friend","from","front","full","fun","game","gave","get","girl","give","go","gold","good","got","great","green","ground","group","grow","had","half","hand","happen","hard","has","have","he","head","hear","heat","help","her","here","high","him","his","home","horse","hot","hour","house","how","however","idea","if","important","in","interest","into","is","it","job","join","just","keep","kind","king","knew","know","land","large","last","late","later","laugh","lead","learn","leave","left","less","let","letter","life","light","like","line","list","listen","little","live","long","look","lot","love","low","made","make","man","many","may","me","mean","measure","men","might","mile","mind","miss","more","most","mother","move","much","must","my","name","near","need","never","new","next","night","no","not","note","nothing","now","number","of","off","often","old","on","once","one","only","open","or","order","other","our","out","over","own","page","paper","part","pass","past","pay","people","perhaps","person","place","plan","play","point","power","press","problem","program","provide","put","question","quick","quite","rain","ran","reach","read","ready","real","reason","receive","record","red","remember","rest","result","right","river","road","rock","room","run","said","same","saw","say","school","sea","second","see","seem","self","send","set","several","she","should","show","side","simple","since","small","so","some","something","soon","sound","south","space","stand","start","state","stay","step","still","stop","story","street","strong","study","such","sun","system","take","talk","tell","ten","term","than","that","the","their","them","then","there","these","they","thing","think","this","those","thought","three","through","time","to","together","told","too","took","top","toward","town","tree","try","turn","two","under","until","up","upon","us","use","usually","very","want","war","was","watch","water","way","we","week","well","went","were","what","when","where","which","while","white","who","why","will","with","word","work","world","would","write","year","yes","yet","you","young","zip","zoo","zoom","zig","zag"];
    const DICT = new Set(WORDS);
    const TILES = "AAAAAAAAAEEEEEEEEEEEEIIIIIIIIIOOOOOOOOUUUUDDDDGGGGBCMPFHVWYKJXQZ".split('');

    let activePath = [];
    let foundWords = new Set();
    let isDragging = false;
    let gameActive = false;
    let timeLeft = 90;

    // RESTORED: Pointing back to your exact original storage database name
    let scoresData = JSON.parse(localStorage.getItem('leaderboard')) || [];

    function createBoard() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      for (let i = 0; i < 36; i++) {
        const letter = TILES[Math.floor(Math.random() * TILES.length)];
        const div = document.createElement('div');
        div.className = 'tile';
        div.textContent = letter;
        div.dataset.index = i;
        grid.appendChild(div);
      }
    }

    function handleInteraction(e) {
      if (!gameActive || !isDragging) return;
      
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      const target = document.elementFromPoint(x, y);

      if (target && target.classList.contains('tile')) {
        const idx = target.dataset.index;
        if (!activePath.includes(idx)) {
          if (activePath.length > 0) {
            const lastIdx = parseInt(activePath[activePath.length - 1]);
            const currIdx = parseInt(idx);
            const rowDiff = Math.abs(Math.floor(lastIdx/6) - Math.floor(currIdx/6));
            const colDiff = Math.abs((lastIdx%6) - (currIdx%6));
            if (rowDiff > 1 || colDiff > 1) return;
          }
          
          activePath.push(idx);
          target.classList.add('active');
          updateTray();
        }
      }
    }

    function updateTray() {
      const word = activePath.map(idx => document.querySelector(`[data-index="${idx}"]`).textContent).join('');
      document.getElementById('tray').textContent = word;
    }

    function submitWord() {
      const word = document.getElementById('tray').textContent.toLowerCase();
      const msg = document.getElementById('msg');
      
      if (DICT.has(word) && !foundWords.has(word)) {
        foundWords.add(word);
        document.getElementById('wordCount').textContent = foundWords.size;
        msg.textContent = "NICE!"; msg.style.color = "var(--green)";
      } else if (word.length >= 3) {
        msg.textContent = foundWords.has(word) ? "ALREADY FOUND" : "NOT IN LIST";
        msg.style.color = "var(--pink)";
      }
      
      document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
      activePath = [];
      document.getElementById('tray').textContent = "DRAG TO CONNECT";
      setTimeout(() => msg.textContent = "", 1000);
    }

    function saveHighScore() {
      const finalCount = foundWords.size;
      const lowestScore = scoresData.length < 10 ? 0 : scoresData[9].score;

      if (finalCount > lowestScore || scoresData.length < 10) {
        setTimeout(() => {
          const name = prompt(`Game Over! You found ${finalCount} words. Enter your initials:`) || "ANON";
          scoresData.push({ name: name.substring(0,5).toUpperCase(), score: finalCount });
          scoresData.sort((a, b) => b.score - a.score);
          scoresData = scoresData.slice(0, 10); // Expanded cleanly to 10 positions
          localStorage.setItem('leaderboard', JSON.stringify(scoresData));
          renderLeaderboard();
        }, 400);
      } else {
        alert(`Game Over! You found ${finalCount} words.`);
      }
    }

    function renderLeaderboard() {
      const listEl = document.getElementById('leaderboard');
      listEl.innerHTML = '';
      for (let i = 0; i < 10; i++) {
        const entry = scoresData[i];
        const li = document.createElement('li');
        if (entry) {
          li.innerHTML = `<span>#${i+1} ${entry.name}</span><span>${entry.score} words</span>`;
        } else {
          li.innerHTML = `<span>#${i+1} ---</span><span>--</span>`;
        }
        listEl.appendChild(li);
      }
    }

    window.addEventListener('mousedown', () => isDragging = true);
    window.addEventListener('touchstart', () => isDragging = true);
    window.addEventListener('mousemove', handleInteraction);
    window.addEventListener('touchmove', handleInteraction);
    window.addEventListener('mouseup', () => { if(isDragging) { isDragging = false; submitWord(); } });
    window.addEventListener('touchend', () => { if(isDragging) { isDragging = false; submitWord(); } });

    function resetGame() {
      foundWords.clear();
      document.getElementById('wordCount').textContent = '0';
      timeLeft = 90;
      gameActive = true;
      createBoard();
      renderLeaderboard();
      startTimer();
    }

    let timerInterval = null;
    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      const timerDisplay = document.getElementById('timer');
      timerInterval = setInterval(() => {
        timeLeft--;
        let m = Math.floor(timeLeft / 60);
        let s = timeLeft % 60;
        timerDisplay.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          gameActive = false;
          saveHighScore();
        }
      }, 1000);
    }

    createBoard();
    resetGame();
  </script>
</body>
</html>
