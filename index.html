<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Words Galore</title>
  <style>
    :root {
      --ink: #25324a;
      --pink: #ff5fa2;
      --gold: #ffbf3f;
      --green: #22c878;
    }

    * { box-sizing: border-box; touch-action: none; } 

    body {
      margin: 0;
      font-family: sans-serif;
      background: #fdfdfd;
      display: flex;
      justify-content: center;
      padding: 10px;
      min-height: 100vh;
    }

    .wrap {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background: #fff;
      padding: 15px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      font-weight: bold;
      text-align: center;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
    }
    .stat-label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .stat-val {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--ink);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .tile {
      aspect-ratio: 1/1;
      background: #fff;
      border: 2px solid #eee;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 800;
      user-select: none;
      pointer-events: auto; 
      box-shadow: 0 4px 0 #e8e8e8;
    }

    .tile.active {
      background: var(--gold);
      color: #fff;
      border-color: #f3a61c;
      box-shadow: 0 2px 0 #f3a61c;
      transform: translateY(2px);
    }

    .current-word-display {
      background: #f0f2f5;
      padding: 12px;
      text-align: center;
      border-radius: 10px;
      font-size: 1.3rem;
      font-weight: 800;
      min-height: 50px;
      letter-spacing: 2px;
      border: 2px dashed #ccc;
      color: var(--ink);
    }

    /* Restored Layout: Leaderboard sits beautifully below the game */
    .leaderboard-box {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin-top: 10px;
    }

    .leaderboard-title {
      text-align: center;
      margin: 0 0 15px 0;
      font-size: 1.2rem;
      color: var(--ink);
    }

    .leaderboard-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .leaderboard-list li {
      display: flex;
      justify-content: space-between;
      padding: 8px 10px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
    }

    .leaderboard-list li:nth-child(even) {
      background: #f8f9fa;
    }

    .controls { display: flex; gap: 10px; justify-content: flex-end; }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-new { background: var(--pink); }

    #msg { text-align: center; font-weight: bold; height: 24px; font-size: 1.1rem; }
  </style>
</head>
<body>

<div class="wrap">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h2 style="margin: 0; color: var(--ink); font-size: 1.8rem;">Words Galore</h2>
    <div class="controls">
      <button class="btn btn-new" onclick="resetGame()">New Game</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-box"><span class="stat-label">Time</span><span id="timer" class="stat-val">1:30</span></div>
    <div class="stat-box"><span class="stat-label">Words</span><span id="wordCount" class="stat-val">0</span></div>
    <div class="stat-box"><span class="stat-label">Score</span><span id="scoreDisplay" class="stat-val">0</span></div>
  </div>

  <div class="current-word-display" id="tray">DRAG TO CONNECT</div>

  <div class="grid" id="grid"></div>

  <div id="msg"></div>

  <div class="leaderboard-box">
    <h3 class="leaderboard-title">🏆 Today's Top Scores</h3>
    <ul class="leaderboard-list" id="leaderboard"></ul>
  </div>
</div>

<script>
const WORDS = ["able","about","above","accept","across","act","action","add","after","again","age","ago","agree","air","all","allow","almost","along","also","always","am","among","amount","and","animal","another","answer","any","appear","are","area","around","arrive","art","as","ask","at","away","baby","back","bad","bag","ball","bank","base","be","bear","beat","beauty","because","become","bed","been","before","begin","behind","believe","best","better","between","big","bird","bit","black","blue","boat","body","book","both","box","boy","bring","build","busy","but","buy","by","call","came","can","car","care","carry","case","cat","cause","center","change","check","child","city","class","clean","clear","close","cold","come","common","complete","contain","continue","cool","copy","corn","cost","could","country","course","cover","create","cut","dark","data","day","dead","deal","decide","deep","develop","did","different","do","dog","done","door","down","draw","dream","drive","dry","during","each","early","earth","easy","eat","edge","end","enough","even","ever","every","example","eye","face","fact","fall","family","far","farm","fast","father","feel","feet","few","field","figure","fill","final","find","fine","fire","first","fish","fit","five","floor","follow","food","for","force","form","found","four","free","friend","from","front","full","fun","game","gave","get","girl","give","go","gold","good","got","great","green","ground","group","grow","had","half","hand","happen","hard","has","have","he","head","hear","heat","help","her","here","high","him","his","home","horse","hot","hour","house","how","however","idea","if","important","in","interest","into","is","it","job","join","just","keep","kind","king","knew","know","land","large","last","late","later","laugh","lead","learn","leave","left","less","let","letter","life","light","like","line","list","listen","little","live","long","look","lot","love","low","made","make","man","many","may","me","mean","measure","men","might","mile","mind","miss","more","most","mother","move","much","must","my","name","near","need","never","new","next","night","no","not","note","nothing","now","number","of","off","often","old","on","once","one","only","open","or","order","other","our","out","over","own","page","paper","part","pass","past","pay","people","perhaps","person","place","plan","play","point","power","press","problem","program","provide","put","question","quick","quite","rain","ran","reach","read","ready","real","reason","receive","record","red","remember","rest","result","right","river","road","rock","room","run","said","same","saw","say","school","sea","second","see","seem","self","send","set","several","she","should","show","side","simple","since","small","so","some","something","soon","sound","south","space","strong","study","such","sun","system","take","talk","tell","ten","term","than","that","the","their","them","then","there","these","they","thing","think","this","those","thought","three","through","time","to","together","told","too","took","top","toward","town","tree","try","turn","two","under","until","up","upon","us","use","usually","very","want","war","was","watch","water","way","we","week","well","went","were","what","when","where","which","while","white","who","why","will","with","word","work","world","would","write","year","yes","yet","you","young","zip","zoo","zoom","zig","zag"];
const DICT = new Set(WORDS);
const TILES = "AAAAAAAAAEEEEEEEEEEEEIIIIIIIIIOOOOOOOOUUUUDDDDGGGGBCMPFHVWYKJXQZ".split('');

let activePath = [];
let foundWords = new Set();
let isDragging = false;
let gameActive = false;
let timeLeft = 90;
let score = 0;

// RESTORED: Pointing to your actual original leaderboard storage data
let scoresData = JSON.parse(localStorage.getItem('leaderboard')) || [];

function createBoard() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let i = 0; i < 36; i++) {
    const letter = TILES[Math.floor(Math.random() * TILES.length)];
    const div = document.createElement('div');
    div.className = 'tile';
    div.textContent = letter;
    div.dataset.index = i;
    grid.appendChild(div);
  }
}

function handleInteraction(e) {
  if (!gameActive || !isDragging) return;
  
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  const target = document.elementFromPoint(x, y);

  if (target && target.classList.contains('tile')) {
    const idx = target.dataset.index;
    if (!activePath.includes(idx)) {
      if (activePath.length > 0) {
        const lastIdx = parseInt(activePath[activePath.length - 1]);
        const currIdx = parseInt(idx);
        const rowDiff = Math.abs(Math.floor(lastIdx/6) - Math.floor(currIdx/6));
        const colDiff = Math.abs((lastIdx%6) - (currIdx%6));
        if (rowDiff > 1 || colDiff > 1) return;
      }
      
      activePath.push(idx);
      target.classList.add('active');
      updateTray();
    }
  }
}

function updateTray() {
  const word = activePath.map(idx => document.querySelector(`[data-index="${idx}"]`).textContent).join('');
  document.getElementById('tray').textContent = word;
}

function submitWord() {
  const word = document.getElementById('tray').textContent.toLowerCase();
  const msg = document.getElementById('msg');
  
  if (DICT.has(word) && !foundWords.has(word)) {
    foundWords.add(word);
    
    // RESTORED: Scoring logic matching the pts on your screenshot (100 pts per letter)
    score += (word.length * 100);
    
    document.getElementById('wordCount').textContent = foundWords.size;
    document.getElementById('scoreDisplay').textContent = score;
    msg.textContent = "NICE!"; msg.style.color = "var(--green)";
  } else if (word.length >= 3) {
    msg.textContent = foundWords.has(word) ? "ALREADY FOUND" : "NOT IN LIST";
    msg.style.color = "var(--pink)";
  }
  
  document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
  activePath = [];
  document.getElementById('tray').textContent = "DRAG TO CONNECT";
  setTimeout(() => msg.textContent = "", 1000);
}

function saveHighScore() {
  const lowestScore = scoresData.length < 10 ? 0 : scoresData[9].score;

  if (score > lowestScore || scoresData.length < 10) {
    setTimeout(() => {
      const name = prompt(`Game Over! You earned ${score} pts. Enter your name:`) || "ANON";
      scoresData.push({ name: name.substring(0,12), score: score });
      scoresData.sort((a, b) => b.score - a.score);
      scoresData = scoresData.slice(0, 10); // Expands to 10 names cleanly
      localStorage.setItem('leaderboard', JSON.stringify(scoresData));
      renderLeaderboard();
    }, 400);
  } else {
    alert(`Game Over! You scored ${score} pts.`);
  }
}

function renderLeaderboard() {
  const listEl = document.getElementById('leaderboard');
  listEl.innerHTML = '';
  
  // Render exactly 10 positions down below the game grid
  for (let i = 0; i < 10; i++) {
    const entry = scoresData[i];
    const li = document.createElement('li');
    if (entry) {
      li.innerHTML = `<span>${i+1}. ${entry.name}</span><span>${entry.score} pts</span>`;
    } else {
      li.innerHTML = `<span>${i+1}. ---</span><span>--</span>`;
    }
    listEl.appendChild(li);
  }
}

window.addEventListener('mousedown', () => isDragging = true);
window.addEventListener('touchstart', () => isDragging = true);
window.addEventListener('mousemove', handleInteraction);
window.addEventListener('touchmove', handleInteraction);
window.addEventListener('mouseup', () => { if(isDragging) { isDragging = false; submitWord(); } });
window.addEventListener('touchend', () => { if(isDragging) { isDragging = false; submitWord(); } });

function resetGame() {
  foundWords.clear();
  score = 0;
  document.getElementById('wordCount').textContent = '0';
  document.getElementById('scoreDisplay').textContent = '0';
  timeLeft = 90;
  gameActive = true;
  createBoard();
  renderLeaderboard();
  startTimer();
}

let timerInterval = null;
function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  const timerDisplay = document.getElementById('timer');
  timerInterval = setInterval(() => {
    timeLeft--;
    let m = Math.floor(timeLeft / 60);
    let s = timeLeft % 60;
    timerDisplay.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      gameActive = false;
      saveHighScore();
    }
  }, 1000);
}

createBoard();
resetGame();
</script>
</body>
</html>
