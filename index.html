<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Words Galore</title>
  <style>
    :root {
      --ink: #25324a;
      --pink: #ff5fa2;
      --gold: #ffbf3f;
      --green: #22c878;
      --blue: #6e7ff2;
      --purple: #9b59b6;
    }
    * { box-sizing: border-box; touch-action: none; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #fffbe2, #ffe8f6, #e7f8ff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      overflow-y: auto;
    }
    .wrap {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 10px 0;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      background: white;
      padding: 14px 20px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      font-weight: bold;
      font-size: 1.15rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      background: white;
      padding: 12px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    }
    .tile {
      aspect-ratio: 1/1;
      background: #ffffff;
      border: 3px solid #e2e8f0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--ink);
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      transition: all 0.15s ease;
      user-select: none;
    }
    .tile.active {
      background: var(--gold);
      color: white;
      border-color: #f3a61c;
      transform: scale(0.9);
    }
    .current-word-display {
      background: white;
      padding: 14px;
      text-align: center;
      border-radius: 20px;
      font-size: 1.3rem;
      font-weight: 900;
      min-height: 52px;
      letter-spacing: 2px;
      color: var(--blue);
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      text-transform: uppercase;
    }
    .controls {
      display: flex;
      gap: 12px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 20px;
      color: white;
      font-weight: bold;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: all 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-shuffle { background: var(--purple); }
    .btn-new { background: var(--pink); }
    
    #msg {  
      text-align: center; 
      font-weight: bold; 
      font-size: 1.1rem;
      min-height: 26px;
    }
    
    /* Leaderboard Styles */
    .leaderboard-box {
      background: white;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    }
    .leaderboard-title {
      margin: 0 0 10px 0;
      font-size: 1.1rem;
      color: var(--ink);
      font-weight: bold;
      text-align: center;
      border-bottom: 2px solid #f3f4f4;
      padding-bottom: 6px;
    }
    .leaderboard-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 8px;
      font-size: 0.95rem;
      border-radius: 8px;
    }
    .leaderboard-row:nth-child(even) { background: #fafafa; }
    .leaderboard-row.highlight { background: #fff4d4; font-weight: bold; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="stats">
    <div>Time: <span id="timer">1:30</span></div>
    <div>Score: <span id="scoreDisplay">0</span></div>
  </div>
  
  <div class="current-word-display" id="tray">DRAG TO FORM WORDS</div>
  <div class="grid" id="grid"></div>
  
  <div id="msg"></div>

  <div class="controls">
    <button class="btn btn-shuffle" onclick="shuffleBoard()">Shuffle Board</button>
    <button class="btn btn-new" onclick="resetGame()">New Game</button>
  </div>

  <!-- Leaderboard Placement Layer -->
  <div class="leaderboard-box">
    <div class="leaderboard-title">🏆 Today's Top Scores</div>
    <div id="leaderboardContent"></div>
  </div>
</div>

<script>
const TILES = "AAAAAAAAABBCCDDDDEEEEEEEEEEEEFFGGGHHIIIIIIJKLLLLMMNNNNNNOOOPPPQRRRRRRSSSSTTTTTTUUUVVWWXXYYYZ".split('');

let DICT = new Set();
let activePath = [];
let foundWords = new Set();
let isDragging = false;
let gameActive = false;
let timeLeft = 90;
let timerInterval = null;
let boardLetters = [];
let currentScore = 0;

// Load Word List
async function loadDictionary() {
  try {
    const res = await fetch('https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    
    const text = await res.text();
    DICT = new Set(
      text.split('\n')
          .map(w => w.trim().toLowerCase())
          .filter(w => w.length >= 3 && /^[a-z]+$/.test(w))
    );
    loadLeaderboard();
    resetGame();
  } catch (e) {
    console.error(e);
    document.getElementById('msg').textContent = "Failed loading words.";
  }
}

function createBoard() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  boardLetters = [];
  
  for (let i = 0; i < 36; i++) {
    const letter = TILES[Math.floor(Math.random() * TILES.length)];
    boardLetters.push(letter);
    
    const div = document.createElement('div');
    div.className = 'tile';
    div.textContent = letter;
    div.dataset.index = i;
    grid.appendChild(div);
  }
}

function shuffleBoard() {
  if (!gameActive) return;
  const tiles = document.querySelectorAll('.tile');
  tiles.forEach(t => t.style.transform = 'scale(0.85)');
  
  setTimeout(() => {
    createBoard();
    activePath = [];
    document.getElementById('tray').textContent = "DRAG TO FORM WORDS";
  }, 200);
}

function handleInteraction(e) {
  if (!gameActive || !isDragging) return;
  
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  const target = document.elementFromPoint(x, y);
  
  if (target && target.classList.contains('tile')) {
    const idx = parseInt(target.dataset.index);
    if (!activePath.includes(idx)) {
      if (activePath.length > 0) {
        const last = activePath[activePath.length-1];
        const rowDiff = Math.abs(Math.floor(last/6) - Math.floor(idx/6));
        const colDiff = Math.abs((last%6) - (idx%6));
        if (rowDiff > 1 || colDiff > 1) return;
      }
      activePath.push(idx);
      target.classList.add('active');
      updateTray();
    }
  }
}

function updateTray() {
  const word = activePath.map(idx => boardLetters[idx]).join('');
  document.getElementById('tray').textContent = word;
}

// Calculate strategic scoring jumps based on length criteria
function calculatePoints(wordLength) {
  if (wordLength === 3) return 100;
  if (wordLength === 4) return 200;
  if (wordLength === 5) return 400;
  return 800; // 6+ letters gets max points rewards
}

function submitWord() {
  const word = document.getElementById('tray').textContent.toLowerCase().trim();
  const msg = document.getElementById('msg');
  
  if (word.length < 3) {
    cleanup();
    return;
  }

  if (DICT.has(word) && !foundWords.has(word)) {
    foundWords.add(word);
    
    // Add Points and display
    const pointsEarned = calculatePoints(word.length);
    currentScore += pointsEarned;
    document.getElementById('scoreDisplay').textContent = currentScore;
    
    // Grant extra time bonuses for long complex words found
    if(word.length >= 5) {
      timeLeft += 5;
      msg.textContent = `💥 AMAZING! +${pointsEarned} pts (+5s Bonus!)`;
      msg.style.color = "var(--purple)";
    } else {
      msg.textContent = `✨ NICE! +${pointsEarned} pts`;
      msg.style.color = "var(--green)";
    }

    // Refill letters & fix underlying structural dataset pointer values 
    activePath.forEach(idx => {
      const newLetter = TILES[Math.floor(Math.random() * TILES.length)];
      boardLetters[idx] = newLetter; 
      const tile = document.querySelector(`[data-index="${idx}"]`);
      if (tile) tile.textContent = newLetter;
    });

  } else {
    msg.textContent = foundWords.has(word) ? "ALREADY FOUND" : "NOT A WORD";
    msg.style.color = "var(--pink)";
  }
  cleanup();
}

function cleanup() {
  document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
  activePath = [];
  document.getElementById('tray').textContent = "DRAG TO FORM WORDS";
}

// Global window pointer interface event capture handlers
window.addEventListener('mousedown', () => isDragging = true);
window.addEventListener('touchstart', () => isDragging = true);
window.addEventListener('mousemove', handleInteraction);
window.addEventListener('touchmove', handleInteraction);
window.addEventListener('mouseup', () => { if(isDragging){ isDragging=false; submitWord(); }});
window.addEventListener('touchend', () => { if(isDragging){ isDragging=false; submitWord(); }});

function resetGame() {
  if(timerInterval) clearInterval(timerInterval);
  foundWords.clear();
  currentScore = 0;
  document.getElementById('scoreDisplay').textContent = '0';
  document.getElementById('msg').textContent = '';
  timeLeft = 90;
  gameActive = true;
  createBoard();
  startTimer();
}

function startTimer() {
  const timerDisplay = document.getElementById('timer');
  timerInterval = setInterval(() => {
    timeLeft--;
    let m = Math.floor(timeLeft / 60);
    let s = timeLeft % 60;
    timerDisplay.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      gameActive = false;
      checkLeaderboardEligibility(currentScore);
    }
  }, 1000);
}

/* LEADERBOARD ARCHITECTURE SYSTEM */
function loadLeaderboard() {
  let scores = JSON.parse(localStorage.getItem('word_galore_scores'));
  if (!scores) {
    // Standard mock list default base targets
    scores = [
      { name: "WordMaster99", score: 2500 },
      { name: "TileFinder", score: 1800 },
      { name: "LexisRex", score: 1200 },
      { name: "BoggleBot", score: 800 },
      { name: "AlphaGamer", score: 400 }
    ];
    localStorage.setItem('word_galore_scores', JSON.stringify(scores));
  }
  renderLeaderboard(scores);
}

function renderLeaderboard(scores, highlightIndex = -1) {
  const container = document.getElementById('leaderboardContent');
  container.innerHTML = "";
  scores.sort((a,b) => b.score - a.score).slice(0, 5).forEach((entry, idx) => {
    const row = document.createElement('div');
    row.className = `leaderboard-row ${idx === highlightIndex ? 'highlight' : ''}`;
    row.innerHTML = `<span>${idx + 1}. ${entry.name}</span><span>${entry.score} pts</span>`;
    container.appendChild(row);
  });
}

function checkLeaderboardEligibility(finalScore) {
  let scores = JSON.parse(localStorage.getItem('word_galore_scores')) || [];
  scores.sort((a,b) => b.score - a.score);
  
  // Is it higher than the 5th place entry score value?
  if (scores.length < 5 || finalScore > scores[4].score) {
    setTimeout(() => {
      const name = prompt(`🎉 Top 5 Score! You earned ${finalScore} points.\nEnter your name for the board:`) || "Anonymous";
      scores.push({ name: name.substring(0, 15), score: finalScore });
      scores.sort((a,b) => b.score - a.score);
      scores = scores.slice(0, 5); // Trim to absolute top 5 list size
      localStorage.setItem('word_galore_scores', JSON.stringify(scores));
      
      const newHighlightIdx = scores.findIndex(e => e.score === finalScore && e.name === name.substring(0, 15));
      renderLeaderboard(scores, newHighlightIdx);
    }, 300);
  } else {
    alert(`Time's Up! Final Score: ${finalScore} points.\nTry again to beat the leader board!`);
  }
}

// Initial running load configuration sequence
loadDictionary();
</script>
</body>
</html>
